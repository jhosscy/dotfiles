# ============================================
# Configuración Base
# ============================================
setw -g mode-keys vi
set -g status-keys vi

# ============================================
# Plugins (TPM)
# ============================================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'fcsonline/tmux-thumbs'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'omerxx/tmux-sessionx'

# ============================================
# Configuración de Plugins
# ============================================
set -g @override_copy_command 'wl-copy'
set -g @yank_action 'copy-pipe'

set -g @thumbs-key 'space'
set -g @thumbs-command 'printf "%s" "{}" | wl-copy'
set -g @thumbs-upcase-command 'xdg-open "{}"'

set -g @prefix_highlight_fg '#1e222a'
set -g @prefix_highlight_bg '#c678dd'
set -g @prefix_highlight_show_copy_mode 'on'
set -g @prefix_highlight_copy_mode_attr 'fg=#282c34,bg=#e5c07b,bold'
# tmux-battery
set -g @batt_icon_charge_tier8 ''
set -g @batt_icon_charge_tier7 ''
set -g @batt_icon_charge_tier6 ''
set -g @batt_icon_charge_tier5 ''
set -g @batt_icon_charge_tier4 ''
set -g @batt_icon_charge_tier3 ''
set -g @batt_icon_charge_tier2 ''
set -g @batt_icon_charge_tier1 ''
set -g @batt_icon_status_charged ''
set -g @batt_icon_status_charging ''
set -g @batt_icon_status_discharging ''
set -g @batt_icon_status_attached ''
set -g @batt_icon_status_unknown '?'
set -g @batt_remain_short 'true'

# ============================================
# tmux-sessionx
# ============================================
set -g @sessionx-bind 'f'
set -g @sessionx-zoxide-mode 'on'

# ============================================
# Atajos de Teclado
# ============================================
bind-key -n C-Space copy-mode
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi Escape send-keys -X cancel

bind-key b list-buffers
bind-key p paste-buffer -p
bind-key P choose-buffer

bind-key -n M-h select-pane -L
bind-key -n M-j select-pane -D
bind-key -n M-k select-pane -U
bind-key -n M-l select-pane -R

bind-key -r M-h resize-pane -L 5
bind-key -r M-j resize-pane -D 5
bind-key -r M-k resize-pane -U 5
bind-key -r M-l resize-pane -R 5


bind-key r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# ============================================
# Paneles — bordes finos onedark
# ============================================
set -g pane-border-lines "single"
set -g pane-border-style "fg=#3e4452"
set -g pane-active-border-style "fg=#98c379,bold"

# Opcional: dim el contenido de paneles inactivos
set -g window-style "fg=#5c6370,bg=default"
set -g window-active-style "fg=#aab2bf,bg=default"

# ============================================
# Statusbar — inspirada en Oh My Tmux, propia
# ============================================
set -g status on
set -g status-position bottom
set -g status-style "bg=default,fg=#aab2bf"
set -g status-interval 5
set -g status-justify "left"
set -g status-left-length 80
set -g status-right-length 120

# Left: sesion y prefix
set -g status-left "#[fg=#282c34,bg=#98c379,bold] #S #[fg=#98c379,bg=default,nobold] #{prefix_highlight} "

# Right: estados, bateria, hora, fecha y host
set -g status-right "#[fg=#e5c07b] #{battery_icon}#[fg=#aab2bf] #{battery_percentage}  #[fg=#e5c07b] #[fg=#aab2bf]%H:%M  #[fg=#aab2bf] %d/%m #[fg=#5c6370] #[fg=#aab2bf] #H "

# Ventanas
set -g window-status-format "#[fg=#3e4452,bg=default,nobold]#[fg=#aab2bf,bg=#3e4452] #[fg=#aab2bf,bg=#3e4452]#I #W#[fg=#3e4452,bg=default]#{?window_zoomed_flag, #[fg=#56b6c2#,bg=default]#[fg=#282c34#,bg=#56b6c2] 󰍉 #[fg=#56b6c2#,bg=default],}#{?window_bell_flag, #[fg=#e06c75#,bg=default]#[fg=#282c34#,bg=#e06c75]  #[fg=#e06c75#,bg=default],}"
set -g window-status-current-format "#[fg=#61afef,bg=default,nobold]#[fg=#1e222a,bg=#61afef,bold] #[fg=#282c34,bg=#61afef,bold]#I #W#[fg=#61afef,bg=default,nobold]#{?window_zoomed_flag, #[fg=#56b6c2#,bg=default]#[fg=#1e222a#,bg=#56b6c2#,bold] #[fg=#56b6c2#,bg=default#,nobold],}#{?window_bell_flag, #[fg=#e06c75#,bg=default]#[fg=#282c34#,bg=#e06c75#,bold]  #[fg=#e06c75#,bg=default#,nobold],}"
setw -g window-status-activity-style "fg=#e5c07b,bg=default,underscore"
setw -g window-status-bell-style "fg=#e06c75,bg=default,bold"
setw -g window-status-last-style "fg=#61afef,bg=default"

# Mensajes y modos
set -g message-style "fg=#98c379,bg=default,bold"
set -g message-command-style "fg=#aab2bf,bg=#282c34"
setw -g mode-style "fg=#282c34,bg=#e5c07b,bold"

# ============================================
# Comportamiento
# ============================================
set -g set-clipboard on
set -g history-limit 10000
set -g renumber-windows on
set -g base-index 1
setw -g pane-base-index 1
set -s escape-time 10
set -sg repeat-time 600
set -g display-time 1000
set -g display-panes-time 800
set -g monitor-activity on
set -g visual-activity off
set -g mouse off
set -g extended-keys on
set -g allow-passthrough on
set -s allow-passthrough on
set -s extended-keys-format csi-u

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",foot*:Tc"

set-option -g focus-events on

# ============================================
# Inicializar TPM
# ============================================
run '~/.tmux/plugins/tpm/tpm'
